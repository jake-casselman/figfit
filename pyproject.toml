[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figfit"
version = "0.4.0"
description = "Figures that read well in print: text at the size you meant, no colliding text, and colours colour-blind readers can tell apart"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Casselman" }]
requires-python = ">=3.10"
dependencies = ["pymupdf", "numpy", "pillow", "matplotlib"]
keywords = ["matplotlib", "figures", "font size", "scientific publishing", "typography", "colour blindness", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/jake-casselman/figfit"
Issues = "https://github.com/jake-casselman/figfit/issues"
Changelog = "https://github.com/jake-casselman/figfit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mac = ["ocrmac"]
tesseract = ["pytesseract"]

[project.scripts]
figfit = "figfit.cli:main"

[tool.setuptools.package-data]
figfit = ["reference.json"]
